<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis v1</title>
    <meta name="description" content="Desktop assistant Electron app skeleton with auto-updater and secure IPC bridge." />
    <meta property="og:title" content="Jarvis v1" />
    <meta property="og:description" content="Desktop assistant Electron app skeleton with auto-updater and secure IPC bridge." />
    <meta property="og:type" content="website" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0b0f19;
        color: #f1f5f9;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-user-select: none;
        user-select: none;
      }

      .window-container {
        width: 100%;
        max-width: 580px;
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 12px;
        padding: 32px 28px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 20px;
        border-bottom: 1px solid #1f2937;
        margin-bottom: 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-icon {
        width: 38px;
        height: 38px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #60a5fa;
      }

      .title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #f8fafc;
      }

      .version-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: #94a3b8;
        background: #1e293b;
        padding: 4px 10px;
        border-radius: 9999px;
        border: 1px solid #334155;
      }

      .version-tag .pulse-dot {
        width: 6px;
        height: 6px;
        background-color: #10b981;
        border-radius: 50%;
      }

      .status-card {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 24px;
      }

      .status-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .status-label {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
      }

      .status-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .badge-info {
        background: #1e3a8a;
        color: #93c5fd;
      }

      .badge-success {
        background: #064e3b;
        color: #6ee7b7;
      }

      .badge-accent {
        background: #312e81;
        color: #c7d2fe;
      }

      .badge-warning {
        background: #78350f;
        color: #fde68a;
      }

      .badge-error {
        background: #7f1d1d;
        color: #fca5a5;
      }

      .status-main {
        font-size: 15px;
        font-weight: 500;
        color: #e2e8f0;
        margin-bottom: 4px;
      }

      .status-sub {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.4;
      }

      .progress-container {
        display: none;
        margin-top: 14px;
        width: 100%;
        height: 6px;
        background: #1e293b;
        border-radius: 9999px;
        overflow: hidden;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: #3b82f6;
        transition: width 0.2s ease;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn-primary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 12px 24px;
        background: #2563eb;
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.15s ease, opacity 0.15s ease;
      }

      .btn-primary:hover:not(:disabled) {
        background: #1d4ed8;
      }

      .btn-primary:active:not(:disabled) {
        background: #1e40af;
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .footer-info {
        margin-top: 20px;
        font-size: 12px;
        color: #64748b;
        text-align: center;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="window-container" id="app-container">
      <header class="header" id="app-header">
        <div class="brand" id="brand-info">
          <div class="brand-icon" id="brand-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12A10 10 0 0 1 12 2Z"></path>
              <path d="M12 6v6l4 2"></path>
            </svg>
          </div>
          <h1 class="title" id="app-title">Jarvis v1</h1>
        </div>
        <div class="version-tag" id="version-tag" title="Application Version">
          <span class="pulse-dot" id="pulse-dot"></span>
          <span id="app-version">v1.0.0</span>
        </div>
      </header>

      <section class="status-card" id="status-card">
        <div class="status-card-header" id="status-card-header">
          <span class="status-label" id="status-label">Update Status</span>
          <span class="status-badge badge-success" id="status-badge">Ready</span>
        </div>
        <div class="status-main" id="update-status-text">Ready and idling</div>
        <div class="status-sub" id="update-status-sub">Listening for update lifecycle notifications</div>
        <div class="progress-container" id="progress-container">
          <div class="progress-bar" id="download-progress-bar"></div>
        </div>
      </section>

      <div class="actions" id="actions-panel">
        <button class="btn-primary" id="check-updates-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 21h5v-5"></path>
          </svg>
          Check for Updates
        </button>
      </div>

      <footer class="footer-info" id="app-footer">
        Jarvis Desktop Assistant Skeleton &bull; Auto-Update Pipeline
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
